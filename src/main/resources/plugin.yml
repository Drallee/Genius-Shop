name: Genius-Shop
main: me.dralle.shop.ShopPlugin
version: ${project.version}
api-version: 1.21
author: Dralle
description: Data-driven economy shop for Paper/Spigot with GUI menus, Vault, dynamic pricing, stock limits/resets, permissions, bulk sell, localization, and a built-in web editor.
depend: [Vault]
softdepend: [SmartSpawner, SmartSpawners]
commands:
  shop:
    description: Open the shop menu or reload the plugin
    usage: /shop [search [query]|favorites|recent|reload|editor|confirmlogin|sell|wiki|resetstock|validate-prices|exportitem|giveitem|ledger|refunds]

permissions:
  geniusshop.refunds:
    description: Allows inspecting, retrying, and reviewing failed refunds
    default: op
  geniusshop.ledger:
    description: Allows searching completed transactions with /shop ledger
    default: op
  geniusshop.editor.analytics:
    description: Allows web editor login and viewing stock analytics
    default: false
  geniusshop.editor.drafts:
    description: Allows editing shop, menu, campaign, and custom-item drafts without publishing
    default: false
  geniusshop.editor.publish:
    description: Allows publishing reviewed drafts; editing permissions for every changed file are also required
    default: false
  geniusshop.editor.commands:
    description: Allows managing custom command drafts and command-bearing files (other file permissions still apply)
    default: false
  geniusshop.editor.database:
    description: Allows reading and modifying live database rows in the web editor
    default: false
  geniusshop.giveitem:
    description: Allows giving configured custom items to online players
    default: op
  geniusshop.items.sellwand:
    description: Allows using the default sell wand
    default: true
  geniusshop.items.premium:
    description: Allows using the premium sell wand
    default: op
  geniusshop.use:
    description: Allows opening /shop
    default: true
  geniusshop.shop:
    description: Allows access to all default protected shops
    default: false
    children:
      geniusshop.shop.spawners: true
      geniusshop.shop.premium: true
      geniusshop.spawners: true
      geniusshop.premium: true
  geniusshop.shop.spawners:
    description: Allows access to the default spawners shop
    default: false
  geniusshop.shop.premium:
    description: Allows access to the default premium shop
    default: false
  geniusshop.spawners:
    description: Legacy permission for the default spawners menu button
    default: false
  geniusshop.premium:
    description: Legacy permission for the default premium menu button
    default: false
  geniusshop.reload:
    description: Allows reloading the plugin with /shop reload
    default: op
  geniusshop.sell:
    description: Allows using /shop sell
    default: true
  geniusshop.resetstock:
    description: Allows using /shop resetstock commands
    default: op
  geniusshop.wiki:
    description: Allows using /shop wiki
    default: op
  geniusshop.validateprices:
    description: Allows using /shop validate-prices
    default: op
  geniusshop.exportitem:
    description: Allows exporting the held item to a web-editor JSON file
    default: op
  geniusshop.login.ip.bypass:
    description: Allows confirming and trusting web-editor logins from a different IP
    default: op
  geniusshop.admin:
    description: Allows access to advanced commands and configuration
    default: op
    children:
      geniusshop.use: true
      geniusshop.ledger: true
      geniusshop.refunds: true
      geniusshop.editor.analytics: true
      geniusshop.editor.drafts: true
      geniusshop.editor.publish: true
      geniusshop.editor.commands: true
      geniusshop.editor.database: true
      geniusshop.reload: true
      geniusshop.sell: true
      geniusshop.resetstock: true
      geniusshop.wiki: true
      geniusshop.validateprices: true
      geniusshop.exportitem: true
      geniusshop.giveitem: true
      geniusshop.login.ip.bypass: true
