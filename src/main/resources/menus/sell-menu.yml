# Sell menu configuration
# This file contains settings for the item selling interface

config-version: 2

display-slot: 22
max-amount: 2304  # Maximum items that can be sold at once (default: 36 stacks of 64)

# Action buttons
buttons:
  confirm:
    material: LIME_STAINED_GLASS
    name: menus.sell.buttons.confirm.name
    lore:
      - menus.sell.buttons.confirm.lore
    slot: 48
  sell-all:
    material: GOLD_BLOCK
    name: menus.sell.buttons.sell-all.name
    lore:
      - menus.sell.buttons.sell-all.lore
    slot: 40
  cancel:
    material: RED_STAINED_GLASS
    name: menus.sell.buttons.cancel.name
    lore:
      - menus.sell.buttons.cancel.lore
    slot: 50
  back:
    material: ENDER_CHEST
    name: menus.sell.buttons.back.name
    lore:
      - menus.sell.buttons.back.lore
    slot: 49

  # Add amount buttons
  add:
    material: LIME_STAINED_GLASS_PANE
    '1':
      name: menus.sell.buttons.add.1.name
      slot: 24
    '10':
      name: menus.sell.buttons.add.10.name
      slot: 25

  # Remove amount buttons
  remove:
    material: RED_STAINED_GLASS_PANE
    '1':
      name: menus.sell.buttons.remove.1.name
      slot: 20
    '10':
      name: menus.sell.buttons.remove.10.name
      slot: 19

  # Set amount buttons
  set:
    material: YELLOW_STAINED_GLASS_PANE
    '64':
      name: menus.sell.buttons.set.64.name
      slot: 26
    '1':
      name: menus.sell.buttons.set.1.name
      slot: 18
