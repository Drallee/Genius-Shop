# Purchase menu configuration
# This file contains settings for the item purchase interface

config-version: 2

display-slot: 22
max-amount: 2304  # Maximum items that can be purchased at once (default: 36 stacks of 64)

# Action buttons
buttons:
  confirm:
    material: LIME_STAINED_GLASS
    name: menus.purchase.buttons.confirm.name
    lore:
      - menus.purchase.buttons.confirm.lore
    slot: 39
  cancel:
    material: RED_STAINED_GLASS
    name: menus.purchase.buttons.cancel.name
    lore:
      - menus.purchase.buttons.cancel.lore
    slot: 41
  back:
    material: ENDER_CHEST
    name: menus.purchase.buttons.back.name
    lore:
      - menus.purchase.buttons.back.lore
    slot: 40

  # Add amount buttons
  add:
    material: LIME_STAINED_GLASS_PANE
    '1':
      name: menus.purchase.buttons.add.1.name
      slot: 24
    '10':
      name: menus.purchase.buttons.add.10.name
      slot: 25
    # Example custom buttons - uncomment and adjust as needed:
    # '4':
    #   material: LIME_STAINED_GLASS_PANE
    #   name: '&aAdd 4'
    #   slot: 33

  # Remove amount buttons
  remove:
    material: RED_STAINED_GLASS_PANE
    '1':
      name: menus.purchase.buttons.remove.1.name
      slot: 20
    '10':
      name: menus.purchase.buttons.remove.10.name
      slot: 19

  # Set amount buttons
  set:
    material: YELLOW_STAINED_GLASS_PANE
    '64':
      name: menus.purchase.buttons.set.64.name
      slot: 26
    '1':
      name: menus.purchase.buttons.set.1.name
      slot: 18
