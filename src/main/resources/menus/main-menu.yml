# Main shop menu configuration
# This file contains the main menu that players see when opening /shop

config-version: 3

title: menus.main.title
rows: 4  # Number of rows (each row = 9 slots, so 3 rows = 27 slots)

# Shop buttons
# Each item can have:
#   - slot: The slot number (0-53)
#   - material: The item material
#   - name: Display name (supports color codes)
#   - lore: List of lore lines (supports %available-times% placeholder)
#   - shop-key: Which shop to open
#   - action: shop|shop-key|command|command-close|close (defaults to shop if shop-key is set)
#   - command: Single command to run (for action: command)
#   - commands: List of commands to run (for action: command)
#   - run-as: player|console (for action: command, default: player)
#   - close-after-action: true/false (for action: command, default: false)
#   - permission: Optional permission to see this button
#   - hide-attributes: true/false - Hide "When in Main Hand" etc.
#   - hide-additional: true/false - Hide additional tooltip info
items:
  info:
    slot: 4
    material: BOOK
    name: menus.main.items.info.name
    lore:
      - menus.main.items.info.lore
  blocks:
    slot: 11
    material: DIRT
    name: menus.main.items.blocks.name
    lore:
      - menus.main.items.blocks.lore
    shop-key: blocks
  spawners:
    slot: 12
    material: SPAWNER
    name: menus.main.items.spawners.name
    lore:
      - menus.main.items.spawners.lore
    shop-key: spawners
    permission: geniusshop.shop.spawners
    hide-attributes: false
    hide-additional: true
  farming:
    slot: 13
    material: GOLDEN_HOE
    name: menus.main.items.farming.name
    lore:
      - menus.main.items.farming.lore
    shop-key: farming
  misc:
    slot: 14
    material: REDSTONE
    name: menus.main.items.misc.name
    lore:
      - menus.main.items.misc.lore
    shop-key: misc
  potions:
    slot: 15
    material: POTION
    name: menus.main.items.potions.name
    lore:
      - menus.main.items.potions.lore
    shop-key: potions
  special:
    slot: 21
    material: NETHERITE_CHESTPLATE
    name: menus.main.items.special.name
    lore:
      - menus.main.items.special.lore
    shop-key: special
  weekend_market:
    slot: 23
    material: NETHER_STAR
    name: menus.main.items.weekend-market.name
    lore:
      - menus.main.items.weekend-market.lore
    shop-key: weekend_market
  premium:
    slot: 22
    material: EMERALD_BLOCK
    name: menus.main.items.premium.name
    lore:
      - menus.main.items.premium.lore
    shop-key: premium
    permission: geniusshop.shop.premium
  wiki:
    slot: 27
    material: WRITABLE_BOOK
    name: menus.main.items.wiki.name
    lore:
      - menus.main.items.wiki.lore
    action: command
    command: 'shop wiki'
    run-as: player
    permission: geniusshop.wiki
  close:
    slot: 31
    material: BARRIER
    name: menus.main.items.close.name
    lore:
      - menus.main.items.close.lore
    action: close
